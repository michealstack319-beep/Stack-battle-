<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STACK BATTLE: LAST SURVIVOR</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101820;color:white;
  font-family:Arial,sans-serif;text-align:center
}
header{padding:15px;background:#17232d}
h1{font-size:24px;color:#ffc857;margin:5px}
p{margin:8px}
#game{
  display:block;width:100%;max-width:700px;
  margin:auto;background:#355e3b;touch-action:none
}
.controls{
  display:flex;justify-content:center;gap:12px;
  padding:14px;flex-wrap:wrap
}
button{
  border:0;border-radius:10px;padding:15px 22px;
  font-size:17px;font-weight:bold;background:#ffc857;
  color:#111;touch-action:manipulation
}
#message{color:#ffc857;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>STACK BATTLE</h1>
<p>LAST SURVIVOR | CREATED BY MICHEAL STACK</p>
<p>Score: <span id="score">0</span> | Health: <span id="health">100</span></p>
</header>

<canvas id="game" width="700" height="420"></canvas>

<div class="controls">
<button id="left">◀ LEFT</button>
<button id="fire">🔫 FIRE</button>
<button id="right">RIGHT ▶</button>
</div>
<div class="controls">
<button id="up">▲ FORWARD</button>
<button id="down">▼ BACK</button>
<button id="restart">RESTART</button>
</div>
<p id="message">Tap FIRE to start battling!</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreText=document.getElementById("score");
const healthText=document.getElementById("health");
const message=document.getElementById("message");

let player, enemies, bullets, score, health, running, keys, lastSpawn;

function reset(){
 player={x:350,y:330,size:15};
 enemies=[];bullets=[];score=0;health=100;
 running=true;keys={};lastSpawn=0;
 scoreText.textContent=score;
 healthText.textContent=health;
 message.textContent="Survive and defeat the enemies!";
}
function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 for(const event of ["pointerup","pointercancel","pointerleave"]){
  b.addEventListener(event,()=>keys[key]=false);
 }
}
hold("left","left");hold("right","right");
hold("up","up");hold("down","down");

document.getElementById("fire").addEventListener("click",()=>{
 if(!running)return;
 bullets.push({x:player.x,y:player.y-15});
});
document.getElementById("restart").addEventListener("click",reset);

function drawPerson(x,y,color,size){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y-size,size*.55,0,Math.PI*2);ctx.fill();
 ctx.fillRect(x-size*.45,y-size*.4,size*.9,size*1.4);
}
function update(time){
 ctx.clearRect(0,0,700,420);
 ctx.fillStyle="#355e3b";ctx.fillRect(0,0,700,420);

 ctx.strokeStyle="#537650";ctx.lineWidth=2;
 for(let x=20;x<700;x+=45){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,420);ctx.stroke();
 }
 for(let y=20;y<420;y+=45){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(700,y);ctx.stroke();
 }

 if(running){
  if(keys.left)player.x-=3;
  if(keys.right)player.x+=3;
  if(keys.up)player.y-=3;
  if(keys.down)player.y+=3;
  player.x=Math.max(18,Math.min(682,player.x));
  player.y=Math.max(35,Math.min(400,player.y));

  if(time-lastSpawn>1300){
   enemies.push({x:20+Math.random()*660,y:20,size:15});
   lastSpawn=time;
  }

  enemies.forEach(e=>{
   const dx=player.x-e.x,dy=player.y-e.y;
   const d=Math.hypot(dx,dy)||1;
   e.x+=dx/d*.65;e.y+=dy/d*.65;
   if(d<22){
    health-=0.15;
    healthText.textContent=Math.max(0,Math.floor(health));
   }
  });

  bullets.forEach(b=>b.y-=7);
  bullets=bullets.filter(b=>b.y>-10);

  for(let i=enemies.length-1;i>=0;i--){
   for(let j=bullets.length-1;j>=0;j--){
    if(Math.hypot(enemies[i].x-bullets[j].x,
       enemies[i].y-bullets[j].y)<20){
     enemies.splice(i,1);bullets.splice(j,1);
     score+=10;scoreText.textContent=score;break;
    }
   }
  }

  if(health<=0){
   running=false;health=0;
   healthText.textContent=0;
   message.textContent="GAME OVER! Tap RESTART to play again.";
  }
 }

 enemies.forEach(e=>drawPerson(e.x,e.y,"#e84b4b",e.size));
 bullets.forEach(b=>{
  ctx.fillStyle="#ffe66d";ctx.fillRect(b.x-3,b.y-8,6,12);
 });
 drawPerson(player.x,player.y,"#49b9ff",player.size);

 requestAnimationFrame(update);
}
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
